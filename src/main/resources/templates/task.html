<html xmlns:th="http://thymeleaf.org">
<head>
<title>Wedding Planning Checklist</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<div class="container text-center w-75 mx-auto">
	    <h1 class="px-5 py-8">Wedding Planning Checklist</h1>
	    <p>Plan your special day, one task at a time ❤️</p>
	   
			 <form action="/addtodo" method="post" class="d-flex w-100">
		
			  <div class="flex-grow-1 p-2">
			  	<input type="text" name="taskContent" class="form-control" placeholder="Add a wedding task (e.g. Book photographer)">
			  </div>
			  <div class="p-2">
			  	<button type="submit" class="btn-subtle theme-success ">+ Add Task</button>
 			  </div>
			</form>
	 
    
		<ul class="list-group w-100">
	       <li th:each="todo : ${listoftodos}" class="list-group-item d-flex align-items-center gap-2">
	              
		       		<form th:action="@{/updatetodo/{id}(id=${todo.id})}" 
		       		      method="post"
		       		      class="d-flex align-items-center gap-2 flex-grow-1 mb-0">       		 	
				            
			       		 <input type="checkbox" 
			       		 		th:checked="${todo.completionStatus}" 
				       			name="completionStatus" 
				       			onchange="this.form.submit()">	       		
				       		
				       	<input type="text" 
				       		   th:value="${todo.taskContent}" 
				       		   th:classappend="${todo.completionStatus} ? 'completed' : ''"
				       		   class="form-control flex-grow-1"
				       		   name="taskContent">

				       	<button type="submit" class="btn-subtle theme-primary">
				       		Save
				       	</button>
				       		
		       		</form>
		       		
	      <div class="d-flex align-items-center"><a th:href="@{/deletetodo/{id}(id=${todo.id})}" title="delete" class="btn-subtle theme-danger"><i class="bi bi-trash3"></i></a></div>
	       		
	       </li>	
		</ul>
	
	
</div>
</body>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</html>
