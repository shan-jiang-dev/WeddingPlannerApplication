<html xmlns:th="http://thymeleaf.org">
<head>
<title>TODO Application</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>
    <h1 class="text-center">Todo Application</h1>
	<form action="/addtodo" method="post" class="text-center">
	 
	 <input type="text" name="taskContent" class="form-control" placeholder="Write your task">
	 <button type="submit" class="btn-subtle theme-success">Add</button>
	
	</form>
	
	<ul class="text-center">
       <li th:each="todo : ${listoftodos}">
       
       		<form th:action="@{/updatetodo/{id}(id=${todo.id})}" method="post">
       		
	       		<input type="text" th:value="${todo.taskContent}" name="taskContent">
	       		<input type="checkbox" th:checked="${todo.completionStatus}" 
	       		name="completionStatus" onchange="this.form.submit()">
	       		<button type="submit" class="btn-subtle theme-primary">Update</button>
	       		
       		</form>
       		
       		<a th:href="@{/deletetodo/{id}(id=${todo.id})}" class="btn-subtle theme-danger">Delete</a>
       		
       </li>	
	</ul>

</body>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</html>
